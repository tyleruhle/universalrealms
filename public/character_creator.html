<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Universal Realms 1066 — Character Creator</title>
<style>
:root {
  /* ── UNIVERSAL REALMS MASTER TOKENS ── */
  --bg-void:        #0e0a04;
  --bg-dark:        #1a1208;
  --bg-card:        #150e04;
  --bg-input:       #0a0600;
  --parch:          #f5edd8;
  --parch-mid:      #ede0c4;
  --parch-dark:     #d4c49a;
  --parch-deep:     #e6d9b8;
  --ink:            #1e1a14;
  --ink-soft:       #4a3f2f;
  --ink-faint:      #8a7a5c;
  --text-on-dark:   #e8d5a3;
  --text-gold-dark: #c8a84c;
  --text-muted-dark:#7a6035;
  --text-dim-dark:  #4a3a18;
  --gold:           #b8860b;
  --gold-bright:    #d4a017;
  --gold-dim:       #7a5a08;
  --gold-pale:      rgba(184,134,11,0.10);
  --gold-border:    rgba(184,134,11,0.28);
  --victory:        #1a4a2a;
  --victory-lt:     #3a8a4a;
  --victory-pale:   #e0f0e4;
  --blood:          #7a1a1a;
  --blood-lt:       #c04040;
  --blood-pale:     #f5e0e0;
  --steel:          #2a3a4a;
  --steel-lt:       #4a6a8a;
  --border-dark:    #2a1e0a;
  --border-dark-2:  #3a2a0a;
  --font-display:   'Cinzel', 'Palatino Linotype', serif;
  --font-body:      'EB Garamond', 'Crimson Text', Georgia, serif;
  --font-mono:      'JetBrains Mono', 'Consolas', monospace;
  --shadow-dark:    0 4px 24px rgba(0,0,0,0.5);
  --shadow-light:   0 4px 24px rgba(26,14,5,0.18);
  --radius-sm:      3px;
  --radius-md:      5px;
  --radius-lg:      7px;
}

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:#1a1208;min-height:100vh;color:#e8d5a3;position:relative;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px);pointer-events:none;z-index:0;}
#app{max-width:860px;margin:0 auto;padding:24px 14px 80px;position:relative;z-index:1;}

/* Header */
.hdr{display:flex;align-items:center;justify-content:center;gap:16px;padding:24px 0 20px;border-bottom:2px solid #8b6914;margin-bottom:20px;text-align:center;}
.hdr-sword{font-size:26px;color:#c8a838;}
.hdr-title{font-family:'Cinzel',serif;font-size:clamp(18px,5vw,32px);font-weight:900;letter-spacing:.22em;color:#c8a838;text-shadow:0 2px 8px rgba(200,168,56,.4);}
.hdr-sub{margin:4px 0 0;font-size:11px;color:#a08848;letter-spacing:.15em;text-transform:uppercase;}

/* Steps */
.steps{display:flex;margin-bottom:20px;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-bottom:2px solid #3a2c10;opacity:.45;transition:all .2s;}
.step.active{border-bottom-color:#c8a838;opacity:1;}
.step.done{border-bottom-color:#27ae60;opacity:.8;}
.step-num{width:24px;height:24px;border-radius:50%;border:1px solid #3a2c10;display:flex;align-items:center;justify-content:center;font-size:11px;color:#5a4020;font-weight:bold;}
.step.active .step-num{border-color:#c8a838;color:#c8a838;background:rgba(200,168,56,.1);}
.step.done .step-num{border-color:#27ae60;color:#27ae60;background:rgba(39,174,96,.1);}
.step-label{font-size:10px;letter-spacing:.05em;text-transform:uppercase;}

/* Card */
.card{background:rgba(30,20,8,.85);border:1px solid #8b6914;border-radius:4px;padding:22px;margin-bottom:20px;box-shadow:0 4px 24px rgba(0,0,0,.5);}
.card-title{font-size:16px;color:#c8a838;margin:0 0 6px;border-bottom:1px solid #8b6914;padding-bottom:10px;letter-spacing:.1em;text-transform:uppercase;}
.step-desc{font-size:12px;color:#a08848;margin:0 0 16px;line-height:1.6;}

/* Form elements */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:4px;}
.flabel{font-size:10px;color:#a08848;text-transform:uppercase;letter-spacing:.1em;}
input[type=text]{background:rgba(10,8,4,.7);border:1px solid #6b5214;border-radius:3px;color:#e8d5a3;padding:10px 12px;font-size:15px;font-family:inherit;outline:none;width:100%;}
input[type=text]:focus{border-color:#c8a838;}
input.err{border-color:#c0392b;}
.err-text{font-size:10px;color:#e74c3c;margin-top:2px;}

/* Info box */
.info-box{background:rgba(139,105,20,.1);border:1px solid #6b5214;border-radius:3px;padding:11px 14px;display:flex;flex-direction:column;gap:5px;}
.info-row{display:flex;gap:8px;font-size:12px;line-height:1.6;flex-wrap:wrap;}

/* Buttons */
.btn-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn-primary{background:linear-gradient(135deg,#8b6914,#c8a838,#8b6914);border:none;border-radius:3px;color:#1a1208;font-family:inherit;font-size:13px;font-weight:bold;padding:12px 22px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 2px 12px rgba(200,168,56,.3);}
.btn-primary:hover{filter:brightness(1.1);}
.btn-secondary{background:transparent;border:1px solid #8b6914;border-radius:3px;color:#c8a838;font-family:inherit;font-size:12px;padding:10px 16px;cursor:pointer;}
.btn-secondary:hover{background:rgba(139,105,20,.15);}
.btn-copied{background:rgba(39,174,96,.15)!important;border-color:#27ae60!important;color:#27ae60!important;}

/* Faction grid */
.faction-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:4px;}
.faction-btn{background:rgba(10,8,4,.6);border:1px solid #6b5214;border-radius:3px;color:#c8b070;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;transition:all .15s;text-align:center;width:100%;}
.faction-btn:hover,.faction-btn.active{background:rgba(139,105,20,.3);border-color:#c8a838;color:#f0d060;box-shadow:0 0 8px rgba(200,168,56,.25);}
.faction-icon{font-size:20px;}
.faction-label{font-size:12px;font-weight:bold;}
.faction-rank{font-size:10px;opacity:.65;}

/* Archetype grid */
.arch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:7px;}
.arch-btn{background:rgba(10,8,4,.6);border:1px solid #6b5214;border-radius:3px;color:#c8b070;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;transition:all .15s;text-align:center;width:100%;}
.arch-btn:hover,.arch-btn.active{background:rgba(139,105,20,.3);border-color:#c8a838;color:#f0d060;box-shadow:0 0 8px rgba(200,168,56,.25);transform:translateY(-1px);}
.arch-icon{font-size:22px;}
.arch-name{font-size:11px;font-weight:bold;line-height:1.3;}
.arch-primary{font-size:9px;opacity:.6;}

/* Arch detail */
.arch-detail{margin-top:14px;}
.arch-detail-hdr{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.arch-detail-name{font-size:15px;font-weight:bold;color:#c8a838;}
.arch-detail-bg{font-size:11px;color:#a08848;margin-top:2px;}
.arch-flavor{margin:0 0 12px;font-size:12px;color:#8b7355;font-style:italic;line-height:1.6;border-left:2px solid #3a2c10;padding-left:9px;}
.arch-bonus-row{display:flex;gap:16px;flex-wrap:wrap;}
.arch-bonus-block{display:flex;flex-direction:column;gap:4px;min-width:100px;}
.arch-bonus-label{font-size:9px;color:#7a6030;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;}
.arch-bonus-line{font-size:12px;font-weight:bold;}

/* Culture grid */
.culture-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:6px;margin-top:4px;}
.culture-btn{background:rgba(10,8,4,.6);border:1px solid #6b5214;border-radius:3px;color:#c8b070;padding:7px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;font-family:inherit;transition:all .15s;width:100%;}
.culture-btn:hover,.culture-btn.active{background:rgba(139,105,20,.3);border-color:#c8a838;color:#f0d060;box-shadow:0 0 8px rgba(200,168,56,.25);transform:translateY(-1px);}
.culture-name{font-size:11px;font-weight:bold;}
.culture-region{font-size:9px;opacity:.6;margin-top:2px;}

/* Dice animation */
.dice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.dice-stat-box{background:rgba(10,8,4,.6);border:1px solid #3a2c10;border-radius:3px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;}
.dice-row{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:4px 0;}
.die{width:26px;height:26px;border:1px solid #8b6914;border-radius:3px;background:rgba(139,105,20,.15);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;color:#c8a838;}
.rolling-label{font-size:16px;color:#c8a838;margin:0 0 6px;border-bottom:1px solid #8b6914;padding-bottom:10px;letter-spacing:.1em;}

/* Result sheet */
.result-card{background:rgba(22,14,4,.95);border:2px solid #c8a838;border-radius:4px;padding:24px;box-shadow:0 0 40px rgba(200,168,56,.2);}
.result-hdr{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;text-align:center;}
.wax{font-size:24px;color:#c8a838;}
.char-name{font-family:'Cinzel',serif;font-size:clamp(20px,5vw,30px);color:#f0d878;margin:0;text-shadow:0 2px 8px rgba(240,216,120,.4);}
.char-sub{margin:3px 0 2px;font-size:11px;color:#a08848;letter-spacing:.12em;text-transform:uppercase;}
.char-faction{margin:0;font-size:12px;color:#c8a838;}
.arch-banner{display:flex;align-items:flex-start;background:rgba(139,105,20,.08);border:1px solid #3a2c10;border-radius:3px;padding:12px 14px;margin-bottom:4px;gap:12px;}
.arch-banner-name{font-size:14px;font-weight:bold;color:#c8a838;margin-bottom:4px;}
.arch-banner-flavor{margin:0;font-size:12px;color:#8b7355;font-style:italic;line-height:1.6;}

/* Section headings */
.sec-head{font-size:10px;color:#8b6914;letter-spacing:.18em;text-transform:uppercase;margin:20px 0 9px;border-top:1px solid #3a2c10;padding-top:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sec-note{font-size:9px;color:#5a4020;font-weight:normal;letter-spacing:0;text-transform:none;}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;}
.stat-card{background:rgba(10,8,4,.6);border:1px solid #3a2c10;border-radius:3px;padding:12px 10px;display:flex;flex-direction:column;gap:3px;}
.stat-card-top{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.stat-icon{font-size:16px;}
.stat-name{font-size:9px;color:#a08848;text-transform:uppercase;letter-spacing:.08em;flex:1;}
.stat-val{font-size:26px;font-weight:bold;line-height:1;}
.stat-dice-row{display:flex;gap:3px;flex-wrap:wrap;align-items:center;}
.stat-die{width:20px;height:20px;border:1px solid #6b5214;border-radius:2px;background:rgba(139,105,20,.1);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold;color:#c8a838;}
.arch-die{background:rgba(200,168,56,.15)!important;color:#c8a838!important;border-color:#8b6914!important;}
.stat-bar{width:100%;height:3px;background:#2a1e08;border-radius:2px;overflow:hidden;margin-top:4px;}
.stat-fill{height:100%;border-radius:2px;}
.stat-footer{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
.stat-range{font-size:9px;font-weight:bold;}
.stat-bonus-lbl{font-size:9px;}
.stat-bonus-desc{font-size:9px;text-align:center;margin-top:2px;line-height:1.3;}

/* Roll breakdown */
.roll-breakdown{background:rgba(10,8,4,.6);border:1px solid #3a2c10;border-radius:3px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
.rb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.rb-stat{font-size:12px;font-weight:bold;width:110px;flex-shrink:0;}
.rb-dice{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11px;}

/* Combat */
.combat-box{background:rgba(10,8,4,.6);border:1px solid #6b1414;border-radius:3px;padding:14px 16px;display:flex;align-items:flex-start;gap:16px;}
.combat-num{font-size:44px;font-weight:bold;color:#c0392b;line-height:1;flex-shrink:0;}
.combat-pills{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
.pill{background:rgba(10,8,4,.6);border:1px solid #3a2c10;border-radius:3px;padding:4px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:60px;}
.pill-label{font-size:10px;color:#7a6030;}
.pill-val{font-size:16px;font-weight:bold;}
.combat-event{display:flex;align-items:flex-start;gap:10px;background:rgba(10,8,4,.5);border:1px solid #3a2c10;border-radius:3px;padding:8px 11px;}
.combat-event-label{font-size:12px;font-weight:bold;color:#7a6030;}
.combat-event-desc{font-size:11px;color:#8b7355;font-style:italic;margin-top:2px;}
.combat-tier{margin-top:8px;font-size:11px;}

/* Traits */
.traits-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px;}
.trait-card{background:rgba(10,8,4,.7);border:1px solid;border-radius:4px;padding:13px;display:flex;flex-direction:column;gap:8px;}
.trait-hdr{display:flex;align-items:center;gap:8px;}
.trait-name{font-size:13px;font-weight:bold;letter-spacing:.04em;}
.trait-flavor{margin:0;font-size:11px;color:#8b7355;font-style:italic;line-height:1.6;border-left:2px solid #3a2c10;padding-left:8px;}
.trait-bonus-wrap{background:rgba(139,105,20,.08);border:1px solid #3a2c10;border-radius:3px;padding:7px 10px;}
.trait-bonus-label{font-size:8px;color:#7a6030;letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:3px;}
.trait-bonus{margin:0;font-size:11px;line-height:1.6;font-weight:bold;}
.combat-trait-card{background:rgba(10,8,4,.7);border:1px solid #6b1414;border-radius:4px;padding:13px;display:flex;flex-direction:column;gap:8px;}
.ct-hdr{display:flex;align-items:center;gap:10px;}
.ct-name{font-size:14px;font-weight:bold;color:#e8a898;letter-spacing:.04em;}
.ct-use{font-size:10px;color:#8b4444;margin-top:3px;}
.ct-locked{background:rgba(10,8,4,.5);border:1px dashed #3a2c10;border-radius:4px;padding:13px;display:flex;align-items:center;gap:11px;opacity:.6;}

/* Culture result */
.culture-result{background:rgba(10,8,4,.6);border:1px solid #6b5214;border-radius:3px;padding:11px 14px;display:flex;flex-direction:column;gap:5px;}
.cr-row{display:flex;gap:8px;font-size:12px;line-height:1.5;flex-wrap:wrap;}

/* Growth table */
.growth-box{background:rgba(10,8,4,.6);border:1px solid #3a2c10;border-radius:3px;padding:12px 14px;}
.growth-note{font-size:11px;color:#7a6030;font-style:italic;margin-bottom:10px;}
.growth-row{display:grid;grid-template-columns:80px 1fr 130px;gap:10px;font-size:11px;padding:5px 0;border-bottom:1px solid #2a1e08;}

/* Export footer */
.export-footer{margin-top:20px;border-top:1px solid #3a2c10;padding-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

@media(max-width:580px){
  .form-row{grid-template-columns:1fr;}
  .arch-bonus-row{flex-direction:column;}
  .combat-box{flex-direction:column;}
  .growth-row{grid-template-columns:70px 1fr;}
  .growth-row span:last-child{display:none;}
}

/* ══ UNIVERSAL REALMS NAV ══ */
.ur-nav-shell {
  height: 52px; display: flex; align-items: stretch;
  background: #1a1208; border-bottom: 1px solid #2a1e0a;
  position: relative; z-index: 1000; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.45);
}
.ur-nav-shell::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(184,134,11,0.4) 20%, rgba(184,134,11,0.4) 80%, transparent 100%);
}
.ur-logo-btn {
  padding: 0 20px; display: flex; flex-direction: column;
  justify-content: center; border-right: 1px solid rgba(255,255,255,0.06);
  text-decoration: none; flex-shrink: 0; transition: background 0.15s;
}
.ur-logo-btn:hover { background: rgba(255,255,255,0.03); }
.ur-logo-name {
  font-family: 'Cinzel', serif; font-size: 12px; font-weight: 600;
  color: #f5edd8; letter-spacing: 2.5px; text-transform: uppercase; line-height: 1;
}
.ur-logo-tag {
  font-family: 'EB Garamond', serif; font-size: 9px; color: #b8860b;
  letter-spacing: 1.5px; margin-top: 3px; font-style: italic; opacity: 0.75;
}
.ur-nav-links {
  display: flex; align-items: stretch; flex: 1;
  padding: 0 4px; overflow-x: auto;
}
.ur-nav-links::-webkit-scrollbar { display: none; }
.ur-nav-lnk {
  display: flex; align-items: center; gap: 7px; padding: 0 13px;
  font-family: 'EB Garamond', Georgia, serif; font-size: 13.5px; font-style: italic;
  color: #9a8468; text-decoration: none;
  border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap;
}
.ur-nav-lnk:hover { color: #e8d9bb; background: rgba(255,255,255,0.03); }
.ur-nav-lnk.cur {
  color: #d4ab55; border-bottom-color: #c99c3a;
  font-style: normal; font-weight: 500; background: rgba(184,134,11,0.06);
}
.ur-nav-ic { font-size: 10px; opacity: 0.65; }
.ur-nav-lnk.cur .ur-nav-ic { opacity: 1; }
.ur-nav-right {
  display: flex; align-items: center; padding: 0 16px; flex-shrink: 0;
  border-left: 1px solid rgba(255,255,255,0.06); gap: 10px;
}
.ur-tool-tag {
  font-family: 'Cinzel', serif; font-size: 8.5px; letter-spacing: 2px;
  text-transform: uppercase; padding: 4px 12px;
  border: 1px solid; border-radius: 2px;
}

/* ── Character Creator — UR Unified Theme ── */
body {
  font-family: 'EB Garamond', Georgia, serif !important;
  background: var(--bg-dark) !important;
  color: var(--text-on-dark) !important;
}
.hdr-title { font-family: var(--font-display) !important; }
.hdr-sub { font-family: var(--font-display) !important; letter-spacing: 0.15em; }
.card {
  background: rgba(21,14,4,0.90) !important;
  border-color: var(--gold-border) !important;
  border-radius: var(--radius-sm) !important;
  box-shadow: var(--shadow-dark) !important;
}
.card-title { font-family: var(--font-display) !important; color: var(--text-gold-dark) !important; border-color: var(--gold-border) !important; }
.step-desc { font-family: var(--font-body) !important; font-style: italic; color: var(--text-muted-dark) !important; }
.flabel { font-family: var(--font-display) !important; letter-spacing: 0.1em; color: var(--text-muted-dark) !important; }
input[type=text] {
  font-family: var(--font-body) !important; font-size: 15px;
  background: rgba(10,8,4,0.7) !important;
  border-color: rgba(184,134,11,0.25) !important;
  color: var(--text-on-dark) !important;
  border-radius: var(--radius-sm) !important;
}
input[type=text]:focus { border-color: var(--gold) !important; }
.btn-primary { font-family: var(--font-display) !important; letter-spacing: 0.08em; border-radius: var(--radius-sm) !important; }
.btn-secondary { font-family: var(--font-display) !important; border-radius: var(--radius-sm) !important; }
.faction-btn, .arch-btn, .culture-btn {
  font-family: var(--font-body) !important;
  border-radius: var(--radius-sm) !important;
}
.faction-label, .arch-name { font-family: var(--font-display) !important; }

.arch-bonus-label { font-family: var(--font-display) !important; letter-spacing: 0.1em; }

function statBonus(stat, v) {
  if (stat==="Martial")     return v>=25?{mod:"+4",label:"+4 to battle rolls"}:v>=20?{mod:"+3",label:"+3 to battle rolls"}:v>=15?{mod:"+2",label:"+2 to battle rolls"}:v>=10?{mod:"+1",label:"+1 to battle rolls"}:{mod:"—",label:"No bonus"};

  if (stat==="Intrigue")    return v>=25?{mod:"+4",label:"+4 to espionage/assassination"}:v>=20?{mod:"+3",label:"+3 to espionage/assassination"}:v>=15?{mod:"+2",label:"+2 to espionage/assassination"}:v>=10?{mod:"+1",label:"+1 to espionage/assassination"}:{mod:"—",label:"No bonus"};
  if (stat==="Stewardship") return v>=25?{mod:"+4",label:"+4 economy, +40% income"}:v>=20?{mod:"+3",label:"+3 economy, +30% income"}:v>=15?{mod:"+2",label:"+2 economy, +20% income"}:v>=10?{mod:"+1",label:"+1 economy, +10% income"}:{mod:"—",label:"No bonus"};
  if (stat==="Learning")    return v>=25?{mod:"+4",label:"+4 religious/scholarly/tech"}:v>=20?{mod:"+3",label:"+3 religious/scholarly/tech"}:v>=15?{mod:"+2",label:"+2 religious/scholarly/tech"}:v>=10?{mod:"+1",label:"+1 religious/scholarly/tech"}:{mod:"—",label:"No bonus"};
  return {mod:"—",label:"No bonus"};
}
function statRange(v) {
  if(v>=25) return {label:"Pinnacle",color:"#f0d060"};
  if(v>=20) return {label:"Legendary",color:"#e8a040"};
  if(v>=15) return {label:"Gifted",color:"#27ae60"};
  if(v>=10) return {label:"Competent",color:"#2980b9"};
  if(v>=6)  return {label:"Below Avg",color:"#a08848"};
  return {label:"Weakness",color:"#c0392b"};
}

function pick(field, val){
  const upd = {[field]: val, errors: Object.assign({}, S.errors)};
  upd.errors[field] = '';
  setState(upd);
}

function setField(field, val){
  const upd = {[field]: val, errors: Object.assign({}, S.errors)};

  setState(upd);
}

// GENERATION
// ══════════════════════════════════════════════════════════════
function roll4d4(){ const d=[1,2,3,4].map(()=>Math.floor(Math.random()*4)+1); return {dice:d,total:d.reduce((a,b)=>a+b,0)}; }
function d6(){ return Math.floor(Math.random()*6)+1; }
function pickTwo(pool){ const c=[...pool]; const out=[]; while(out.length<2&&c.length>0){ const i=Math.floor(Math.random()*c.length); out.push(c.splice(i,1)[0]); } return out; }

function generate(archId, cultId, factId){
  const arch = ARCHETYPES.find(a=>a.id===archId);
  const rolls={}, stats={}, capped={};
  STAT_KEYS.forEach(k=>{
    const r=roll4d4(); rolls[k]=r;
    const raw=r.total+(arch.bonuses[k]||0);
    capped[k]=raw>STAT_CAP; stats[k]=Math.min(STAT_CAP,raw);
  });
  const combatRoll=d6();
  const combatEvent=COMBAT_EVENTS.find(e=>e.roll===combatRoll);
  const pc=Math.min(20,arch.pc+combatEvent.bonus);
  const traitStat=arch.primary;
  const traits=pickTwo(TRAITS[traitStat]);
  const combatTrait=(stats.Martial>10||pc>10)?COMBAT_TRAITS[Math.floor(Math.random()*COMBAT_TRAITS.length)]:null;
  const cultureData=CULTURES.find(c=>c.id===cultId);
  const factionData=FACTIONS.find(f=>f.id===factId);
  return {arch,rolls,stats,capped,pc,combatEvent,traitStat,traits,combatTrait,cultureData,factionData};
}

    {g:"+1 Martial",    t:"Win a decisive battle as commanding general",           l:"Once per in-game year"},
    {g:"+1 Diplomacy",  t:"Successfully conclude a major treaty or alliance",      l:"Once per in-game year"},
    {g:"+1 Stewardship",t:"Province under your administration 2 years uncontested",l:"Once per in-game year"},
    {g:"+1 Intrigue",   t:"Complete an Intrigue action at DC 16+",                  l:"Once per in-game year"},
    {g:"+1 Learning",   t:"Complete a scholarly quest or University 4 turns",       l:"Once per in-game year"},
    {g:"+1 any stat",   t:"Exceptional RP — mod discretion",                        l:"Once per in-game season max"},
  ].map(row=>`<div class="growth-row"><span style="color:#c8a838;">${row.g}</span><span>${row.t}</span><span style="color:#7a6030;">${row.l}</span></div>`).join('');

  return `
    <div class="result-card" id="result-card">
      <div class="result-hdr">
        <span class="wax">⚜</span>
        <div>
          <h2 class="char-name">${fn} ${ln}</h2>
          <p class="char-sub">${r.arch.name} — ${r.cultureData.label}</p>
          <p class="char-faction">${r.factionData.icon} ${r.factionData.label} — ${r.factionData.rank}</p>
        </div>
        <span class="wax">⚜</span>
      </div>
      <div class="arch-banner">
        <span style="font-size:28px;margin-right:12px;flex-shrink:0;">${r.arch.icon}</span>
        <div>
          <div class="arch-banner-name">${r.arch.name}</div>
          <p class="arch-banner-flavor">"${r.arch.flavor}"</p>
        </div>
      </div>

      <div class="sec-head">Stats <span class="sec-note">4d4 roll + archetype bonus, capped at ${STAT_CAP}</span></div>
      <div class="stats-grid">${statsHtml}</div>

      <div class="sec-head">Roll Breakdown <span class="sec-note">4d4 per stat + archetype bonus</span></div>
      <div class="roll-breakdown">${rollBreakHtml}</div>

      <div class="sec-head">Personal Combat</div>
      <div class="combat-box">
        <div class="combat-num">${r.pc}</div>
        <div style="flex:1;">
          <div class="combat-pills">
            <div class="pill"><span class="pill-label">Archetype</span><span class="pill-val" style="color:#e8d5a3;">${r.arch.pc}</span></div>
            <span style="color:#5a4020;font-size:14px;">+</span>
            <div class="pill" style="border-color:${r.combatEvent.bonus>0?'#c0392b':'#3a2c10'}">
              <span class="pill-label">Background (1d6=${r.combatEvent.roll})</span>
              <span class="pill-val" style="color:${r.combatEvent.bonus>0?'#c0392b':'#5a4020'}">${r.combatEvent.bonus>0?'+'+r.combatEvent.bonus:'0'}</span>
            </div>
            <span style="color:#5a4020;font-size:14px;">=</span>
            <div class="pill" style="border-color:#8b6914;"><span class="pill-label">Final</span><span class="pill-val" style="color:#c8a838;">${r.pc}</span></div>
          </div>
          <div class="combat-event" style="border-color:${r.combatEvent.bonus>0?'#6b1414':'#3a2c10'}">
            <span style="font-size:18px;flex-shrink:0;">${r.combatEvent.icon}</span>
            <div>
              <div class="combat-event-label" style="color:${r.combatEvent.bonus>0?'#e8a898':'#7a6030'}">
                ${r.combatEvent.label}${r.combatEvent.bonus>0?`<span style="color:#c0392b;margin-left:6px;">+${r.combatEvent.bonus} Combat</span>`:''}
              </div>
              <div class="combat-event-desc">${r.combatEvent.desc}</div>
            </div>
          </div>
          <div class="combat-tier">${pcTier}</div>
        </div>
      </div>

      <div class="sec-head">Childhood Traits <span class="sec-note">${r.traitStat} pool (archetype primary) — 2 awarded</span></div>
      <div class="traits-grid">${traitsHtml}</div>

      <div class="sec-head" style="margin-top:16px;">Combat Trait <span class="sec-note">Requires Martial or Personal Combat above 10</span></div>
      ${ctHtml}

      <div class="sec-head">Cultural Heritage</div>
      <div class="culture-result">
        <div class="cr-row"><strong>Regional Bonuses:</strong><span>${r.cultureData.bonuses}</span></div>
        <div class="cr-row"><strong>Combat Tradition:</strong><span>${r.cultureData.combat}</span></div>
        <div class="cr-row"><strong>Context:</strong><em style="color:#7a6045;">${r.cultureData.context}</em></div>
      </div>

      <div class="sec-head">Stat Growth Through Play</div>
      <div class="growth-box">
        <div class="growth-note">Stats grow only by doing the thing — never automatically. Hard cap: ${HARD_CAP}.</div>
        <div>${growthRows}</div>
      </div>

      <div class="export-footer">
        ${btn('Re-roll Stats','btn-primary','reroll()')}
        <button class="btn-secondary ${S.copied?'btn-copied':''}" onclick="copySheet()">${S.copied?'Copied!':'Copy Sheet'}</button>
        <button class="btn-secondary ${S.saved?'btn-copied':''}" onclick="saveCharacter()">${S.saved?'Saved!':'Save to Profile'}</button>
        ${btn('New Character','btn-secondary','restart()')}
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
// STEP LOGIC
// ══════════════════════════════════════════════════════════════
function validate(step){
  const e={};
  if(step===1){
    if(!S.firstName.trim()) e.firstName="Required.";
    if(!S.familyName.trim()) e.familyName="Required.";
    if(!S.faction) e.faction="Select a faction type.";
  }
  if(step===2&&!S.archetype) e.archetype="Select an archetype.";
  if(step===3&&!S.culture) e.culture="Select a culture.";
  return e;
}

function goNext(){
  const e=validate(S.step);
  if(Object.keys(e).length>0){ setState({errors:e}); return; }
  if(S.step===3){
    startRolling();
  } else {
    setState({step:S.step+1,errors:{}});
  }
}
function goBack(){ setState({step:S.step-1,errors:{}}); }

function startRolling(){
  setState({rolling:true,result:null,step:4,errors:{}});
  let tick=0;
  const iv=setInterval(()=>{
    const anim={};
    STAT_KEYS.forEach(k=>{anim[k]=[0,0,0,0].map(()=>Math.floor(Math.random()*4)+1);});
    S.diceAnim=anim; render();
    tick++;
    if(tick>=14){
      clearInterval(iv);
      const res=generate(S.archetype,S.culture,S.faction);
      S.result=res; S.rolling=false; S.diceAnim={};
      render();
      setTimeout(()=>{
        const el=document.getElementById('result-card');
        if(el) el.scrollIntoView({behavior:'smooth'});
      },100);
    }
  },100);
}

function reroll(){
  S.result=null; S.rolling=true; render();
  let tick=0;
  const iv=setInterval(()=>{
    const anim={};
    STAT_KEYS.forEach(k=>{anim[k]=[0,0,0,0].map(()=>Math.floor(Math.random()*4)+1);});
    S.diceAnim=anim; render();
    tick++;
    if(tick>=14){
      clearInterval(iv);
      const res=generate(S.archetype,S.culture,S.faction);
      S.result=res; S.rolling=false; S.diceAnim={};
      render();
      setTimeout(()=>{
        const el=document.getElementById('result-card');
        if(el) el.scrollIntoView({behavior:'smooth'});
      },100);
    }
  },100);
}

function copySheet(){
  const text=buildExport(S.result);
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>{setState({copied:true});setTimeout(()=>setState({copied:false}),2500);});
  } else {
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    setState({copied:true}); setTimeout(()=>setState({copied:false}),2500);
  }
}

async function saveCharacter(){
  if(!window.UR_USER){
    window.location.href='/login.html?redirect=/character_creator.html';
    return;
  }
  const r=S.result;
  try{
    const res=await fetch('/api/characters',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body:JSON.stringify({
        name:        (S.firstName+' '+S.familyName).trim(),
        faction:     S.faction,
        factionLabel:r.factionData.label,
        factionRank: r.factionData.rank,
        archetype:   S.archetype,
        archetypeName:r.arch.name,
        archetypeIcon:r.arch.icon,
        culture:     S.culture,
        cultureLabel:r.cultureData.label,
        cultureRegion:r.cultureData.region,
        cultureBonuses:r.cultureData.bonuses,
        cultureCombat: r.cultureData.combat,
        stats:       r.stats,
        pc:          r.pc,
        traits:      r.traits.map(t=>({name:t.name,bonus:t.bonus,icon:t.icon,flavor:t.flavor})),
        combatTrait: r.combatTrait?{name:r.combatTrait.name,bonus:r.combatTrait.bonus,icon:r.combatTrait.icon}:null,
      }),
    });
    if(res.ok){setState({saved:true});setTimeout(()=>setState({saved:false}),3000);}
  }catch(e){console.error('Save failed',e);}
}

function restart(){
  S={step:1,firstName:"",familyName:"",faction:"",archetype:"",culture:"",hovArch:null,hovCulture:null,result:null,rolling:false,diceAnim:{},errors:{},copied:false,saved:false};
  render(); window.scrollTo({top:0,behavior:'smooth'});
}

// ══════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════
const STEP_LABELS=["Identity","Archetype","Culture","Character Sheet"];

function render(){
  // Steps indicator
  const stepsEl=document.getElementById('steps');
  if(stepsEl) stepsEl.innerHTML=STEP_LABELS.map((l,i)=>{
    const n=i+1;
    const active=S.step===n&&!S.rolling;
    const done=S.step>n;
    const cls='step'+(active?' active':done?' done':'');
    const num=done?'✓':n;
    return `<div class="${cls}"><div class="step-num">${num}</div><span class="step-label">${l}</span></div>`;
  }).join('');

  // View
  const viewEl=document.getElementById('view');
  if(!viewEl) return;
  if(S.rolling){ viewEl.innerHTML=viewRolling(); return; }
  if(S.step===4&&S.result){ viewEl.innerHTML=viewResult(); return; }
  if(S.step===1){ viewEl.innerHTML=viewStep1(); return; }
  if(S.step===2){ viewEl.innerHTML=viewStep2(); return; }
  if(S.step===3){ viewEl.innerHTML=viewStep3(); return; }
}

render();
</script>
<script src="/js/ur-auth.js"></script>
